<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Game Cacing Lapar</title>

<style>
body{
    margin:0;
    background:#222;
    color:white;
    text-align:center;
    font-family:Arial,sans-serif;
}

h1{
    color:#00ff66;
}

canvas{
    background:#111;
    border:4px solid #00ff66;
    margin-top:10px;
}

#score{
    font-size:22px;
    margin-top:10px;
}
</style>

</head>
<body>

<h1>🐍 Game Cacing Lapar</h1>
<div id="score">Skor : 0</div>

<canvas id="game" width="400" height="400"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const box = 20;

let snake = [
    {x:200,y:200}
];

let food = {
    x:Math.floor(Math.random()*20)*box,
    y:Math.floor(Math.random()*20)*box
};

let dx = box;
let dy = 0;
let score = 0;

document.addEventListener("keydown",ubahArah);

function ubahArah(e){

if(e.key=="ArrowLeft" && dx==0){
dx=-box; dy=0;
}

if(e.key=="ArrowUp" && dy==0){
dx=0; dy=-box;
}

if(e.key=="ArrowRight" && dx==0){
dx=box; dy=0;
}

if(e.key=="ArrowDown" && dy==0){
dx=0; dy=box;
}

}

function gambar(){

ctx.fillStyle="#111";
ctx.fillRect(0,0,400,400);

ctx.fillStyle="red";
ctx.fillRect(food.x,food.y,box,box);

ctx.fillStyle="#00ff66";

snake.forEach(function(bagian){
ctx.fillRect(bagian.x,bagian.y,box-2,box-2);
});

let kepala={
x:snake[0].x+dx,
y:snake[0].y+dy
};

if(kepala.x==food.x && kepala.y==food.y){

score++;
document.getElementById("score").innerHTML="Skor : "+score;

food={
x:Math.floor(Math.random()*20)*box,
y:Math.floor(Math.random()*20)*box
};

}else{
snake.pop();
}

if(kepala.x<0) kepala.x=380;
if(kepala.x>380) kepala.x=0;
if(kepala.y<0) kepala.y=380;
if(kepala.y>380) kepala.y=0;

for(let i=0;i<snake.length;i++){
if(kepala.x==snake[i].x && kepala.y==snake[i].y){
alert("Game Over!\nSkor: "+score);
location.reload();
}
}

snake.unshift(kepala);

}

setInterval(gambar,120);

</script>

</body>
</html>
