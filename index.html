<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Cacing Lapar - Cyber Arcade Game</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            background-color: #0b0e14;
            color: #e2e8f0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* Header & Logo Cacing Lapar */
        .header {
            text-align: center;
            margin-bottom: 8px;
        }
        .logo {
            font-size: 1.8rem;
            font-weight: 900;
            letter-spacing: 1.5px;
            background: linear-gradient(45deg, #00ff88, #00b8ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            text-shadow: 0 0 18px rgba(0, 255, 136, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }
        .logo-icon {
            width: 32px;
            height: 32px;
            background: #00ff88;
            border-radius: 50%;
            position: relative;
            box-shadow: 0 0 12px #00ff88;
            border: 2px solid #fff;
        }
        /* Mata & Aksesoris Cacing di Logo */
        .logo-icon::before {
            content: '';
            position: absolute;
            top: 8px;
            left: 6px;
            width: 6px;
            height: 6px;
            background: #0b0e14;
            border-radius: 50%;
            box-shadow: 12px 0 0 #0b0e14;
        }
        .logo-icon::after {
            content: '';
            position: absolute;
            bottom: -6px;
            left: 10px;
            width: 12px;
            height: 12px;
            background: #00b8ff;
            border-radius: 50%;
            z-index: -1;
        }

        /* Panel Informasi Game */
        .info-panel {
            display: flex;
            gap: 15px;
            margin-bottom: 10px;
            background: rgba(255, 255, 255, 0.05);
            padding: 8px 18px;
            border-radius: 20px;
            border: 1px solid rgba(0, 255, 136, 0.25);
            align-items: center;
        }
        .info-box {
            font-size: 0.95rem;
            font-weight: 700;
        }
        .info-box span {
            color: #00ff88;
        }

        /* Container Canvas Game */
        #game-container {
            position: relative;
            border-radius: 16px;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.9), 0 0 20px rgba(0, 255, 136, 0.2);
            overflow: hidden;
            border: 2px solid rgba(0, 255, 136, 0.3);
        }
        canvas {
            display: block;
            background: #121824;
        }

        /* Panel Kontrol & Petunjuk */
        .controls-area {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            max-width: 400px;
            margin-top: 12px;
            padding: 0 10px;
        }
        
        .how-to-play {
            font-size: 0.75rem;
            color: #94a3b8;
            max-width: 210px;
            line-height: 1.35;
        }
        .how-to-play b {
            color: #00ff88;
        }

        /* Virtual Joystick Analog */
        #joystick-container {
            width: 90px;
            height: 90px;
            background: rgba(255, 255, 255, 0.06);
            border: 2px solid rgba(0, 255, 136, 0.4);
            border-radius: 50%;
            position: relative;
            touch-action: none;
        }
        #joystick-knob {
            width: 36px;
            height: 36px;
            background: radial-gradient(circle, #00ff88, #00b8ff);
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 12px #00ff88;
            pointer-events: none;
        }

        /* Tombol Suara */
        .btn-audio {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(0, 255, 136, 0.4);
            color: #fff;
            padding: 5px 12px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 0.8rem;
            transition: 0.2s;
        }
        .btn-audio:hover {
            background: rgba(0, 255, 136, 0.2);
        }

        /* Overlay Game Over / Win */
        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(11, 14, 20, 0.9);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(5px);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        #overlay.active {
            opacity: 1;
            pointer-events: auto;
        }
        #overlay h2 {
            font-size: 1.8rem;
            margin-bottom: 8px;
            color: #ff3366;
            text-shadow: 0 0 12px #ff3366;
        }
        #overlay p {
            margin-bottom: 20px;
            font-size: 0.95rem;
            color: #cbd5e1;
            text-align: center;
            padding: 0 20px;
        }
        #overlay button {
            padding: 10px 26px;
            font-size: 1rem;
            font-weight: bold;
            color: #0b0e14;
            background: #00ff88;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            box-shadow: 0 0 15px #00ff88;
            transition: transform 0.2s;
        }
        #overlay button:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <!-- Header & Logo Game -->
    <div class="header">
        <div class="logo">
            <div class="logo-icon"></div>
            Cacing Lapar
        </div>
    </div>

    <!-- Info Panel (Level, Skor, Tombol Musik) -->
    <div class="info-panel">
        <div class="info-box">Level: <span id="level-txt">1</span></div>
        <div class="info-box">Skor: <span id="score-txt">0</span></div>
        <button class="btn-audio" id="audio-btn" onclick="toggleAudio()">🔊 Musik: ON</button>
    </div>

    <!-- Area Main Canvas -->
    <div id="game-container">
        <canvas id="canvas" width="400" height="400"></canvas>
        <div id="overlay">
            <h2 id="overlay-title">CACING MATI!</h2>
            <p id="overlay-desc">Cacing menabrak rintangan atau dirinya sendiri.</p>
            <button onclick="restartGame()">Main Lagi</button>
        </div>
    </div>

    <!-- Kontrol Game -->
    <div class="controls-area">
        <div class="how-to-play">
            <b>Cara Bermain:</b><br>
            • Desktop: <b>Panah Keyboard / WASD</b>.<br>
            • Mobile: Putar <b>Joystick Analog</b>.<br>
            • Makan <b>makanan bercahaya (Hijau/Biru)</b> untuk naik level! Hindari <b>Rintangan Merah & Dinding</b>.
        </div>
        <div id="joystick-container">
            <div id="joystick-knob"></div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        // UI Elemen
        const levelTxt = document.getElementById('level-txt');
        const scoreTxt = document.getElementById('score-txt');
        const overlay = document.getElementById('overlay');
        const overlayTitle = document.getElementById('overlay-title');
        const overlayDesc = document.getElementById('overlay-desc');
        const audioBtn = document.getElementById('audio-btn');

        // Audio System (Web Audio API Synthesizer - Tanpa File Eksternal)
        let audioCtx = null;
        let isAudioMuted = false;
        let bgmInterval = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                startBGM();
            }
        }

        function playSound(freq, type, duration) {
            if (isAudioMuted || !audioCtx) return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.06, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch (e) {}
        }

        // Background Music Melody
        function startBGM() {
            const notes = [261.63, 293.66, 329.63, 392.00, 440.00]; // C4, D4, E4, G4, A4
            let step = 0;
            bgmInterval = setInterval(() => {
                if (!isAudioMuted && audioCtx) {
                    playSound(notes[step % notes.length], 'sine', 0.2);
                    step++;
                }
            }, 400);
        }

        function toggleAudio() {
            initAudio();
            isAudioMuted = !isAudioMuted;
            audioBtn.innerText = isAudioMuted ? "🔇 Musik: OFF" : "🔊 Musik: ON";
        }

        // Variabel Utama Game
        let level = 1;
        let score = 0;
        let isGameOver = false;

        // Cacing (Worm)
        let worm = [];
        let wormLength = 8;
        let head = { x: 200, y: 200 };
        let angle = 0; // Sudut pergerakan (radian)
        let speed = 2.5;

        // Makanan & Rintangan
        let food = { x: 0, y: 0, radius: 6 };
        let obstacles = [];

        // Inisialisasi Level & Rintangan
        function generateLevel() {
            // Reset Cacing
            head = { x: 200, y: 200 };
            angle = 0;
            worm = [];
            for (let i = 0; i < wormLength; i++) {
                worm.push({ x: head.x - i * 2, y: head.y });
            }

            // Generate Makanan
            spawnFood();

            // Generate Rintangan (Berdasarkan Level)
            obstacles = [];
            let count = Math.min(level + 2, 12);
            for (let i = 0; i < count; i++) {
                let ox, oy, size;
                do {
                    ox = Math.random() * (canvas.width - 60) + 30;
                    oy = Math.random() * (canvas.height - 60) + 30;
                    size = Math.random() * 15 + 10;
                } while (Math.hypot(ox - head.x, oy - head.y) < 80);

                obstacles.push({ x: ox, y: oy, size: size });
            }
        }

        function spawnFood() {
            food.x = Math.random() * (canvas.width - 40) + 20;
            food.y = Math.random() * (canvas.height - 40) + 20;
        }

        // Update Posisi & Logika
        function update() {
            if (isGameOver) return;

            // Pergerakan Kepala Cacing
            head.x += Math.cos(angle) * speed;
            head.y += Math.sin(angle) * speed;

            // Dinding / Batas Arena
            if (head.x < 10 || head.x > canvas.width - 10 || head.y < 10 || head.y > canvas.height - 10) {
                playSound(120, 'sawtooth', 0.3);
                endGame();
                return;
            }

            // Ikatan Badan Cacing
            worm.unshift({ x: head.x, y: head.y });
            while (worm.length > wormLength) {
                worm.pop();
            }

            // Tabrakan dengan Badan Sendiri
            for (let i = 15; i < worm.length; i++) {
                if (Math.hypot(head.x - worm[i].x, head.y - worm[i].y) < 8) {
                    playSound(120, 'sawtooth', 0.3);
                    endGame();
                    return;
                }
            }

            // Tabrakan dengan Rintangan
            for (let obs of obstacles) {
                if (Math.hypot(head.x - obs.x, head.y - obs.y) < obs.size + 6) {
                    playSound(120, 'sawtooth', 0.3);
                    endGame();
                    return;
                }
            }

            // Makan Makanan
            if (Math.hypot(head.x - food.x, head.y - food.y) < food.radius + 8) {
                score += 10 + level * 5;
                scoreTxt.innerText = score;
                wormLength += 4;
                playSound(520, 'sine', 0.1);
                spawnFood();

                // Cek Naik Level tiap 50 skor
                if (score >= level * 50) {
                    level++;
                    levelTxt.innerText = level;
                    playSound(700, 'triangle', 0.25);
                    generateLevel();
                }
            }
        }

        // Render Grafik Canvas
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Latar Belakang Pattern Grid Cyber
            ctx.strokeStyle = "rgba(0, 255, 136, 0.05)";
            ctx.lineWidth = 1;
            for (let x = 0; x < canvas.width; x += 20) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
            }
            for (let y = 0; y < canvas.height; y += 20) {
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
            }

            // Gambar Rintangan (Merah Neon)
            obstacles.forEach(obs => {
                ctx.fillStyle = '#ff3366';
                ctx.shadowColor = '#ff3366';
                ctx.shadowBlur = 10;
                ctx.beginPath();
                ctx.arc(obs.x, obs.y, obs.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;
            });

            // Gambar Makanan (Glow Hijau/Biru)
            ctx.fillStyle = '#00ff88';
            ctx.shadowColor = '#00ff88';
            ctx.shadowBlur = 12;
            ctx.beginPath();
            ctx.arc(food.x, food.y, food.radius, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;

            // Gambar Cacing (Badan ke Ekor)
            for (let i = worm.length - 1; i >= 0; i--) {
                let p = worm[i];
                let ratio = i / worm.length;
                let radius = 8 * (1 - ratio * 0.4);

                ctx.fillStyle = i === 0 ? '#00b8ff' : `hsl(${140 + i * 2}, 100%, 50%)`;
                ctx.shadowColor = i === 0 ? '#00b8ff' : '#00ff88';
                ctx.shadowBlur = i === 0 ? 10 : 0;

                ctx.beginPath();
                ctx.arc(p.x, p.y, radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;
            }

            // Mata pada Kepala Cacing
            if (worm.length > 0) {
                let eyeOffsetAngle = 0.5;
                let eyeDist = 5;

                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.arc(
                    head.x + Math.cos(angle - eyeOffsetAngle) * eyeDist,
                    head.y + Math.sin(angle - eyeOffsetAngle) * eyeDist,
                    2.5, 0, Math.PI * 2
                );
                ctx.arc(
                    head.x + Math.cos(angle + eyeOffsetAngle) * eyeDist,
                    head.y + Math.sin(angle + eyeOffsetAngle) * eyeDist,
                    2.5, 0, Math.PI * 2
                );
                ctx.fill();
            }
        }

        function endGame() {
            isGameOver = true;
            overlay.classList.add('active');
            overlayTitle.innerText = "CACING MATI!";
            overlayDesc.innerText = `Kamu bertahan hingga Level ${level} dengan Skor ${score}!`;
        }

        function restartGame() {
            level = 1;
            score = 0;
            wormLength = 8;
            scoreTxt.innerText = score;
            levelTxt.innerText = level;
            isGameOver = false;
            overlay.classList.remove('active');
            generateLevel();
        }

        // Kontrol Keyboard (Desktop)
        window.addEventListener('keydown', (e) => {
            initAudio();
            switch (e.key) {
                case 'ArrowUp': case 'w': case 'W': angle = -Math.PI / 2; break;
                case 'ArrowDown': case 's': case 'S': angle = Math.PI / 2; break;
                case 'ArrowLeft': case 'a': case 'A': angle = Math.PI; break;
                case 'ArrowRight': case 'd': case 'D': angle = 0; break;
            }
        });

        // Kontrol Virtual Joystick Analog 360° (Mobile & Touch)
        const joystick = document.getElementById('joystick-container');
        const knob = document.getElementById('joystick-knob');
        let joyActive = false;
        let startX, startY;

        joystick.addEventListener('pointerdown', (e) => {
            initAudio();
            joyActive = true;
            startX = e.clientX;
            startY = e.clientY;
        });

        window.addEventListener('pointermove', (e) => {
            if (!joyActive) return;
            let dx = e.clientX - startX;
            let dy = e.clientY - startY;
            let dist = Math.min(Math.hypot(dx, dy), 30);
            let currentAngle = Math.atan2(dy, dx);

            knob.style.transform = `translate(calc(-50% + ${Math.cos(currentAngle) * dist}px), calc(-50% + ${Math.sin(angle) * dist}px))`;

            if (dist > 8) {
                angle = currentAngle;
            }
        });

        window.addEventListener('pointerup', () => {
            if (!joyActive) return;
            joyActive = false;
            knob.style.transform = `translate(-50%, -50%)`;
        });

        // Game Loop Utama
        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        // Inisialisasi Pertama
        generateLevel();
        gameLoop();
    </script>
</body>
    </html>
